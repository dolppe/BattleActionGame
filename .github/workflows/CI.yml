
name: BattleAction CI

on:
  pull_request:
    branches:
      - main


jobs:
  CI:
    if: github.repository == 'dolppe/BattleActionGamePrivate'

    runs-on:
      - self-hosted
      - Windows
      - X64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Build BattleActionGame Editor
        shell : cmd
        run: |
          "F:\UnrealEngine-5.1\Engine\Build\BatchFiles\Build.bat" ^
            BattleActionGameEditor ^
            Win64 ^
            Development ^
            -Project="%GITHUB_WORKSPACE%\BattleActionGame.uproject" ^
            -WaitMutex
      - name: Build BattleActionGame Client And Server
        shell: cmd
        run: |
          "F:\UnrealEngine-5.1\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun ^
            -project="%GITHUB_WORKSPACE%\BattleActionGame.uproject" ^
            -noP4 ^
            -platform=Win64 ^
            -clientconfig=Development ^
            -serverconfig=Development ^
            -server ^
            -client ^
            -build
      - name: C++ AutomationTest (UnitTest + ActorTest)
        shell: cmd
        run: '"F:\UnrealEngine-5.1\Engine\Binaries\Win64\UnrealEditor-Cmd.exe" "%GITHUB_WORKSPACE%\BattleActionGame.uproject" -ExecCmds="Automation RunTest BattleAction;Quit" -unattended -nopause -nosplash -nop4 -stdout -FullStdOutLogOutput -ReportExportPath="%GITHUB_WORKSPACE%\Saved\AutomationReports\Cpp"'

