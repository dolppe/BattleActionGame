
name: BattleAction CI

on:
  pull_request:
    branches:
      - main


jobs:
  runner-test:
    if: github.repository == 'dolppe/BattleActionGamePrivate'

    runs-on:
      - self-hosted
      - Windows
      - X64
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Runner Test
        shell: powershell
        run: |
          Write-Host "BattleAction CI Started"
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Workspace: $env:GITHUB_WORKSPACE"
          git --version
      - name: Build BattleActionGame
        shell: cmd
        run: |
          "F:\UnrealEngine-5.1\Engine\Build\BatchFiles\RunUAT.bat" BuildCookRun ^
            -project="%GITHUB_WORKSPACE%\BattleActionGame.uproject" ^
            -noP4 ^
            -platform=Win64 ^
            -clientconfig=Development ^
            -serverconfig=Development ^
            -server ^
            -client ^
            -build
